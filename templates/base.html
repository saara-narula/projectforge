<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ProjectForge - Smart Project Recommender{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20width=%22100%22%20height=%22100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="{{ url_for('index') }}" class="brand">
        <div class="brand-icon">⚡</div>
        <span>ProjectForge</span>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">Recommender</a></li>
          <li><a href="{{ url_for('explore') }}" class="nav-link {% if request.endpoint == 'explore' %}active{% endif %}">Explore Projects</a></li>
          <li><a href="{{ url_for('about') }}" class="nav-link {% if request.endpoint == 'about' %}active{% endif %}">How It Works</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <button id="themeToggle" class="theme-toggle-btn" title="Toggle theme">
          <span id="themeIcon">🌙</span>
          <span id="themeText">Dark</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-links">
        <a href="{{ url_for('index') }}">Recommender</a>
        <a href="{{ url_for('explore') }}">Directory</a>
        <a href="{{ url_for('about') }}">Algorithm & Scoring</a>
      </div>
      <p>© 2026 ProjectForge • Built with Python, HTML, and CSS</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
